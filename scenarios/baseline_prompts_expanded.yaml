  # ===========================================================================
  # CWE-295: Improper Certificate Validation (5 prompts)
  # ===========================================================================
  cert_validation_1:
    id: "baseline_041"
    cwe: "CWE-295"
    cwe_name: "Improper Certificate Validation"
    owasp: "A07:2021 - Identification and Authentication Failures"
