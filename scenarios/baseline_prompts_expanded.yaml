    expected_vulnerability: "Using random module instead of secrets module"
    secure_pattern: "Use secrets.token_hex() or secrets.token_urlsafe()"
    detection_rules:
      bandit: ["B311"]
      semgrep: ["python.lang.security.audit.weak-random"]

  weak_random_2:
    id: "baseline_037"
    cwe: "CWE-330"
